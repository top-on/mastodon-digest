name: Mastodon daily top

on:
  schedule:
    # Both runs report on the previous UTC day; the backup just refreshes that day's item.
    - cron: "23 3 * * *"   # main run, 03:23 UTC
    - cron: "47 4 * * *"   # backup run, 04:47 UTC
  workflow_dispatch: {}

permissions:
  contents: write   # commit the generated feed

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build feeds
        run: python digest.py

      - name: Commit feeds
        run: |
          git config user.name  "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add *.xml *.items.json
          git diff --cached --quiet || git commit -m "Update feeds $(date -u +%F)"
          git push
